spring.application.name=carrito-service
server.port=${PORT:8085}

# --- Base de datos MySQL (se crea sola si no existe) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ferreteria_carrito?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT (la misma clave en los 7 servicios) ---
jwt.secret=${JWT_SECRET:LosMaestros-Ferreteria-ClaveSecretaJWT-2026-CambiarEnProduccion}
jwt.issuer=losmaestros-auth

# --- Clave para llamadas internas entre microservicios ---
app.internal-key=${INTERNAL_KEY:clave-interna-los-maestros}

# --- CORS: origen del frontend React (Vite) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- La seguridad usa JWT: se desactiva el usuario en memoria que Spring crea por defecto ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Otros microservicios ---
app.services.productos-url=${PRODUCTOS_URL:http://localhost:8083}
app.services.inventario-url=${INVENTARIO_URL:http://localhost:8084}
