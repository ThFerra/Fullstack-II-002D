<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Degradado para el ícono industrial -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef6c00" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
  </defs>

  <!-- Ícono: Estructura de Casa + Engranaje / Herramienta -->
  <g transform="translate(10, 10)">
    <!-- Silueta de Techo / Estructura -->
    <path d="M 50 10 L 90 45 L 80 45 L 80 85 L 20 85 L 20 45 L 10 45 Z" fill="url(#orangeGrad)" />
    
    <!-- Tuerca / Engranaje Central -->
    <path d="M 50 35 L 56 35 L 58 40 L 63 38 L 66 43 L 62 47 L 64 52 L 69 54 L 67 60 L 61 60 L 59 65 L 63 69 L 58 72 L 55 68 L 50 70 L 48 68 L 43 72 L 38 69 L 42 65 L 40 60 L 34 60 L 32 54 L 37 52 L 39 47 L 35 43 L 38 38 L 43 40 L 45 35 Z" fill="#1e272e" />
    
    <!-- Centro Hueco Tuerca -->
    <circle cx="50" cy="53" r="7" fill="#ffffff" />
  </g>

  <!-- Texto Principal: FERRETERÍA LOS MAESTROS -->
  <text x="120" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="1">
    FERRETERÍA
  </text>
  
  <text x="120" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#ef6c00" letter-spacing="2">
    LOS MAESTROS
  </text>

  <!-- Línea decorativa inferior -->
  <rect x="120" y="100" width="360" height="4" rx="2" fill="#ef6c00" />
</svg>
